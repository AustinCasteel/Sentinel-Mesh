name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-type-test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (Ruff)
        run: uv run ruff check src/ mcp_servers/ eval/ --output-format=github

      - name: Format check (Ruff)
        run: uv run ruff format --check src/ mcp_servers/ eval/

      - name: Type check (Mypy)
        run: uv run mypy src/
        continue-on-error: true  # Strict mypy may need iterative fixes

      - name: Unit tests
        run: uv run pytest tests/ -v --tb=short -q
        continue-on-error: true  # Tests may need external services

      - name: Check import structure
        run: |
          uv run python -c "
          from src.config import get_settings
          from src.agents.state import AgentState, Severity, TriageResult
          from src.core.llm_factory import get_llm
          print('✓ All core imports successful')
          "
